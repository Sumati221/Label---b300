<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>B300 Label Generator</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#f0f2f5;height:100vh;display:flex;flex-direction:column}
header{background:#0d47a1;color:#fff;padding:12px 24px;display:flex;align-items:center;gap:12px}
header h1{font-size:16px} .tag{background:rgba(255,255,255,.15);padding:2px 8px;border-radius:10px;font-size:10px}
.main{flex:1;display:grid;grid-template-columns:320px 1fr;overflow:hidden}
.panel{background:#fff;border-right:1px solid #ddd;padding:16px;overflow-y:auto}
.panel h2{font-size:12px;font-weight:700;margin:14px 0 6px;color:#0d47a1}
.panel select,.panel input[type="file"]{width:100%;padding:8px;border:1px solid #ddd;border-radius:6px;font-size:13px}
.info{background:#e3f2fd;border-radius:6px;padding:10px;font-size:11px;margin:10px 0;line-height:1.7}
.info b{color:#0d47a1}
.btn{width:100%;padding:12px;background:#0d47a1;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;margin-top:12px}
.btn:disabled{opacity:.3}
.btn:hover:not(:disabled){background:#093080}
.preview{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;align-items:center;background:#fafbfc}
.label-container{position:relative;border:2px solid #1a73e8;border-radius:4px;box-shadow:0 2px 12px rgba(0,0,0,.1);background:#fff}
.label-container img.symbol{position:absolute;pointer-events:none}
.label-container .text-field{position:absolute;border:1px dashed #aaa;background:rgba(255,255,200,.3);font-size:inherit;padding:1px 2px;outline:none;overflow:hidden;resize:none}
.label-container .text-field:focus{border-color:#1a73e8;background:rgba(200,230,255,.3)}
.meta{font-size:11px;color:#666;margin-top:8px;text-align:center}
.log{margin-top:12px;background:#f5f5f7;border-radius:6px;padding:6px;font-size:9px;font-family:monospace;max-height:140px;overflow-y:auto;line-height:1.6;color:#555}
.toggle{display:flex;align-items:center;gap:6px;margin:8px 0;font-size:11px}
.toggle input{cursor:pointer}
</style>
</head><body>
<header>
  <h1>B300 Label Generator</h1>
  <span class="tag">v6 • Template Matching</span>
</header>
<div class="main">
<div class="panel">
<h2>1. Select Label PDF</h2>
<select id="sel" onchange="onSelect()"><option value="">Loading...</option></select>
<label for="pdfUpload" style="display:block;margin-top:10px;font-size:11px;font-weight:600">Or upload a PDF</label>
<input id="pdfUpload" type="file" accept="application/pdf,.pdf" onchange="onUploadChange()">
<div style="font-size:10px;color:#666;margin-top:4px">Processed temporarily; not saved to a Databricks Volume.</div>

<div class="info" id="info"><b>Status:</b> Select a label</div>

<h2>2. Settings</h2>
<label for="country">Country label text</label>
<select id="country"><option value="">-- Select country (optional) --</option></select>
<label for="product">CDLM product</label>
<select id="product"><option value="">-- Select product (optional) --</option></select>
<select id="dpi"><option value="300">300 DPI</option><option value="600" selected>600 DPI</option></select>

<button class="btn" id="genBtn" onclick="generate()" disabled>Generate Label</button>

<div class="log" id="logBox"></div>
</div>

<div class="preview" id="preview">
  <p style="color:#888;margin-top:40px">Select a label and click Generate</p>
</div>
</div>

<script>
let catalog=[], currentId='';

async function loadCatalog(){
  try{
    const r=await fetch('/api/catalog');
    const d=await r.json();
    catalog=d.products||[];
    const s=document.getElementById('sel');
    s.innerHTML='<option value="">-- Select PDF label --</option>';
    catalog.forEach(p=>{
      const o=document.createElement('option');
      o.value=p.sheet_name;
      o.textContent=`${p.product_code} - ${p.product_desc} (${p.symbol_count} symbols)`;
      s.appendChild(o);
    });
    if(!catalog.length) s.innerHTML='<option>No labels found</option>';
    loadCountryLabelOptions();
  }catch(e){addLog('Catalog error: '+e.message,true)}
}

async function loadCountryLabelOptions(){
  try{
    const r=await fetch('/api/country-labels');
    const data=await r.json();
    if(data.error) throw new Error(data.error);
    const country=document.getElementById('country');
    const product=document.getElementById('product');
    (data.countries||[]).forEach(value=>country.add(new Option(value,value)));
    (data.products||[]).forEach(value=>product.add(new Option(value,value)));
  }catch(e){addLog('Country label data unavailable: '+e.message,true)}
}

async function getCountryLabelText(){
  const country=document.getElementById('country').value;
  const product=document.getElementById('product').value;
  if(!country||!product)return '';
  const r=await fetch(`/api/country-labels?country=${encodeURIComponent(country)}&product=${encodeURIComponent(product)}`);
  const data=await r.json();
  if(data.error)throw new Error(data.error);
  const printable=(data.entries||[]).filter(entry=>!entry.is_reference);
  const references=(data.entries||[]).filter(entry=>entry.is_reference);
  if(references.length) addLog(`CDLM references ${references.map(entry=>entry.text).join(', ')}; no unverified reference text was inserted.`,false);
  return printable.map(entry=>entry.text).join('\n\n');
}

function escapeHtml(value){
  return String(value).replace(/[&<>'"]/g, char=>({
    '&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'
  }[char]));
}

function onSelect(){
  currentId=document.getElementById('sel').value;
  if(currentId) document.getElementById('pdfUpload').value='';
  document.getElementById('genBtn').disabled=!currentId;
  if(currentId){
    const p=catalog.find(x=>x.sheet_name===currentId);
    if(p) document.getElementById('info').innerHTML=
      `<b>Product:</b> ${p.product_code}<br><b>Size:</b> ${p.label_size}<br><b>Symbols detected:</b> ${p.symbol_count}`;
  }
}

function onUploadChange(){
  const file=document.getElementById('pdfUpload').files[0];
  if(!file)return;
  currentId='';
  document.getElementById('sel').value='';
  document.getElementById('genBtn').disabled=false;
  document.getElementById('info').innerHTML=
    `<b>Uploaded:</b> ${escapeHtml(file.name)}<br><b>Size:</b> ${(file.size/1024/1024).toFixed(1)} MB<br><b>Storage:</b> Temporary for this generation only`;
}

async function generate(){
  const file=document.getElementById('pdfUpload').files[0];
  if(!currentId&&!file)return;
  const btn=document.getElementById('genBtn');
  btn.disabled=true; btn.textContent='Detecting...';
  addLog('Running template matching...');
  const dpi=document.getElementById('dpi').value;

  try{
    let r;
    if(file){
      const form=new FormData();
      form.append('file',file);
      r=await fetch(`/api/generate-upload?dpi=${dpi}`,{method:'POST',body:form});
    }else{
      r=await fetch(`/api/generate/${encodeURIComponent(currentId)}?dpi=${dpi}`);
    }
    const data=await r.json();
    if(data.error){
      const preview=document.getElementById('preview');
      let h='<div style="padding:20px;max-width:500px;text-align:left">';
      h+=`<h3 style="color:red;margin-bottom:8px">Symbol matching failed</h3>`;
      h+=`<p style="font-size:12px">${data.error}</p>`;
      if(data.failed_symbols&&data.failed_symbols.length){
        h+='<ul style="font-size:11px;margin:8px 0 8px 16px">';
        data.failed_symbols.forEach(f=>{h+=`<li><b>${f.asset}</b>: ${f.reason} (conf:${(f.confidence||0).toFixed(3)})</li>`;});
        h+='</ul>';}
      h+='</div>';preview.innerHTML=h;addLog(data.error,true);return;}
    const countryText=await getCountryLabelText();
    const textWasPlaced=renderLabel(data,countryText);
    if(countryText&&!textWasPlaced) addLog('CDLM text was found, but this template has no detected editable text region. It was not placed automatically.',true);
    const notPresent=data.debug&&data.debug.failed_symbols?data.debug.failed_symbols.filter(f=>f.confidence===0).length:0;
    addLog(`Matched ${data.symbols_placed} symbol(s); ${notPresent} asset(s) not in this label.`,false,true);
  }catch(e){addLog(e.message,true)}
  finally{btn.disabled=false;btn.textContent='Generate Label'}
}
function renderLabel(data,countryText=''){
  const preview=document.getElementById('preview');
  const SCALE=3.5;
  const wPx=data.w_mm*SCALE;
  const hPx=data.h_mm*SCALE;
  let html=`<div class="label-container" style="width:${wPx}px;height:${hPx}px;">`;
  (data.symbols||[]).forEach(sym=>{
    const imgData=(data.symbol_images||{})[sym.asset];
    if(!imgData)return;
    const x=(sym.x*100).toFixed(2),y=(sym.y*100).toFixed(2);
    const w=(sym.w*100).toFixed(2),h=(sym.h*100).toFixed(2);
    html+=`<img class="symbol" src="data:image/png;base64,${imgData}" style="left:${x}%;top:${y}%;width:${w}%;height:${h}%;filter:grayscale(100%)">`;
  });
  const tr=data.text_region;
  let textWasPlaced=false;
  if(tr){
    const tx=(tr.x*100).toFixed(2),ty=(tr.y*100).toFixed(2);
    const tw=(tr.w*100).toFixed(2),th=(tr.h*100).toFixed(2);
    html+=`<textarea style="position:absolute;left:${tx}%;top:${ty}%;width:${tw}%;height:${th}%;border:1px solid #999;background:#fff;font-family:Arial;font-size:9px;padding:4px;outline:none;resize:none" placeholder="Product information">${escapeHtml(countryText)}</textarea>`;
    textWasPlaced=Boolean(countryText);
  }
  html+=`</div>`;
  html+=`<div class="meta">${data.label_size} | ${data.symbols_placed} symbols | B&W</div>`;
  preview.innerHTML=html;
  return textWasPlaced;
}
function addLog(msg,err=false,ok=false){
  const b=document.getElementById('logBox');
  const c=err?'color:red':ok?'color:green':'';
  b.innerHTML+=`<div style="${c}">${new Date().toLocaleTimeString().slice(0,8)} ${msg}</div>`;
  b.scrollTop=b.scrollHeight;
}
loadCatalog();
</script>
</body></html>
